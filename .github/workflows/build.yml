name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir app && cd app && mkdir www
          cp ../index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Rows com.example.rows --web-dir=www
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rows-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
